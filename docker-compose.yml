services:
  db:
    image: postgres:17-alpine
    container_name: pcm_postgres_db
    restart: always
    environment:
      POSTGRES_DB: pcm_db
      POSTGRES_USER: pcm_user
      POSTGRES_PASSWORD: pcm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm_user -d pcm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: pcm_django_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://pcm_user:pcm_password@db:5432/pcm_db
      - PORT=8000
    command: sh -c "uv run python manage.py migrate && uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
