{% extends 'pcm_web/base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <h2 style="color: #000080; margin-bottom: 20px;">Hubungi Kami</h2>

    <!-- Ini bagian yang memunculkan notifikasi sukses -->
    {% if messages %}
        {% for message in messages %}
            <div style="padding: 15px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px; margin-bottom: 20px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Formulir Kontak (Menggunakan namespace pcm_web:kontak) -->
    <form method="POST" action="{% url 'pcm_web:kontak' %}">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="nama" style="display: block; margin-bottom: 5px;">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px;">Alamat Email:</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="subjek" style="display: block; margin-bottom: 5px;">Subjek:</label>
            <input type="text" id="subjek" name="subjek" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label for="pesan" style="display: block; margin-bottom: 5px;">Isi Pesan:</label>
            <textarea id="pesan" name="pesan" rows="5" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>
        
        <button type="submit" style="padding: 10px 20px; background-color: #000080; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;">
            Kirim Pesan
        </button>
    </form>
</div>
{% endblock %}
